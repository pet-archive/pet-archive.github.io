name: Validate data JSON

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JSON'lari dogrula + fallback'in guncel oldugunu kontrol et
        run: python3 tools/build-fallback.py --check
